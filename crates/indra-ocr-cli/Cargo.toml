[package]
name = "indra-ocr-cli"
description = "Command line for Indra OCR: PDFs and images to markdown, text or JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "indra-ocr"
path = "src/main.rs"

[dependencies]
indra-ocr.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
