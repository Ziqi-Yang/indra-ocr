[package]
name = "indra-ocr"
description = "Fast CPU OCR: line detection, CTC recognition, reading order and markdown (Rust port of Indra OCR)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["ort", "native", "pdf", "download"]
native = ["dep:indra-engine"]
ort = ["dep:ort"]
pdf = ["dep:libloading"]
download = ["dep:hf-hub"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
indra-engine = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "std", "ndarray"], optional = true }
libloading = { version = "0.8", optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif", "pnm"] }
tiff = "0.11"
zune-jpeg = "0.5"
regex = "1"
libc = "0.2"

[dev-dependencies]
indra-engine.workspace = true

# examples that compare with ONNX Runtime or need the native engine / pdfium
[[example]]
name = "bench_det"
required-features = ["ort", "native"]

[[example]]
name = "bench_rec"
required-features = ["ort", "native"]

[[example]]
name = "bench_order"
required-features = ["ort", "native"]

[[example]]
name = "debug_line"
required-features = ["ort", "native", "pdf"]

[[example]]
name = "bench_stages"
required-features = ["native"]

[[example]]
name = "eval_int8"
required-features = ["native"]
