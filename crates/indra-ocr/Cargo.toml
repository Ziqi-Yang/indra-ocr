[package]
name = "indra-ocr"
description = "Fast CPU OCR: line detection, CTC recognition, reading order and markdown (Rust port of Indra OCR)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ort", "pdf", "download"]
ort = ["dep:ort"]
pdf = ["dep:pdfium-render"]
download = ["dep:hf-hub"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "std", "ndarray"], optional = true }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"], optional = true }
hf-hub = { version = "1", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif", "pnm"] }
tiff = "0.11"
unicode-normalization = "0.1"
unicode-general-category = "1.1"
unicode-bidi = "0.3"
regex = "1"
libc = "0.2"

[dev-dependencies]
